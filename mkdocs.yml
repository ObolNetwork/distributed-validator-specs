site_name: Distributed Validator Specifications
site_description: Reference implementations of the Obol Distributed Validator protocol
site_author: Obol Labs, Inc.
site_url: https://obolnetwork.github.io/distributed-validator-specs

repo_name: ObolNetwork/distributed-validator-specs
repo_url: https://github.com/ObolNetwork/distributed-validator-specs
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_signature_annotations: true
            show_if_no_docstring: false
            inherited_members: true
            members_order: source
            separate_signature: true
            filters: ["!^_"]
            docstring_section_style: google

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Cluster:
      - Cluster Files: dv-spec/cluster-files.md
  - Key Generation:
      - FROST DKG: dv-spec/dkg-frost.md
      - Pedersen DKG: dv-spec/dkg-pedersen.md
      - Cluster Edit Protocols: dv-spec/dkg-cluster-edits.md
      - DKG Sync: dv-spec/dkg-sync.md
      - Reliable Broadcast: dv-spec/reliable-broadcast.md
  - Wire Format:
      - Encoding and Hashing: dv-spec/hashing.md
  - Duty Workflow:
      - Duty Scheduling: dv-spec/duty-scheduling.md
      - ValidatorAPI: dv-spec/validatorapi.md
      - Consensus (QBFT): dv-spec/consensus.md
      - Partial Signature Exchange: dv-spec/parsigex.md
      - Signature Aggregation: dv-spec/sigagg.md
      - Beacon Broadcast: dv-spec/broadcast.md
  - Cluster Coordination:
      - Priority: dv-spec/priority.md
      - InfoSync: dv-spec/infosync.md
      - Peer Info: dv-spec/peerinfo.md
  - Client:
      - Chain: client/chain.md
      - Containers: client/containers.md
      - Networking: client/networking.md
      - Validator: client/validator.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ObolNetwork/distributed-validator-specs

copyright: |
  &copy; 2025 Obol Labs, Inc.
